name: Build and Release Electron App

on:
  push:
    branches:
      - desktop-app

permissions:
  contents: write

jobs:

  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      release_created: ${{ steps.create_release.outputs.release_created }}
    steps:
      - uses: actions/checkout@v3
      
      - name: Get version
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
          
      - name: Check if release exists
        id: check_release
        run: |
          if gh release view "v${{ steps.get_version.outputs.version }}" &> /dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Create Release
        id: create_release
        if: steps.check_release.outputs.exists == 'false'
        run: |
          gh release create "v${{ steps.get_version.outputs.version }}" \
            --title "Silvernote v${{ steps.get_version.outputs.version }}" \
            --notes "## 🎉 Nouvelle version de Silvernote v${{ steps.get_version.outputs.version }}

          ### 📦 Téléchargements
          - **Windows**: Silvernote Setup ${{ steps.get_version.outputs.version }}.exe
          - **macOS**: Silvernote-${{ steps.get_version.outputs.version }}-arm64.dmg
          - **Linux**: Silvernote-${{ steps.get_version.outputs.version }}.AppImage

          ### 🔄 Mise à jour automatique
          Si vous avez déjà installé Silvernote, l'application se mettra à jour automatiquement."
          echo "release_created=true" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - run: npm install
      - run: npm run maj:front
      - run: npm run build:win
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: List build files (before rename)
        run: dir build
      
      - name: Rename Windows installer
        shell: pwsh
        run: |
          $VERSION = "${{ needs.create-release.outputs.version }}"
          
          # Renommer le .exe (noter les espaces dans le nom original)
          $oldExeName = "build\Silvernote Setup $VERSION.exe"
          $newExeName = "Silvernote-Setup-$VERSION.exe"
          if (Test-Path $oldExeName) {
            Rename-Item -Path $oldExeName -NewName $newExeName
            Write-Host "Renamed: $oldExeName -> $newExeName"
          } else {
            Write-Host "File not found: $oldExeName"
            Get-ChildItem build\*.exe
          }
          
          # Renommer le .blockmap (noter les espaces dans le nom original)
          $oldBlockmapName = "build\Silvernote Setup $VERSION.exe.blockmap"
          $newBlockmapName = "Silvernote-Setup-$VERSION.exe.blockmap"
          if (Test-Path $oldBlockmapName) {
            Rename-Item -Path $oldBlockmapName -NewName $newBlockmapName
            Write-Host "Renamed: $oldBlockmapName -> $newBlockmapName"
          } else {
            Write-Host "File not found: $oldBlockmapName"
            Get-ChildItem build\*.blockmap
          }
      
      - name: List build files (after rename)
        run: dir build
        
      - name: Upload to Release
        shell: pwsh
        run: |
          $VERSION = "${{ needs.create-release.outputs.version }}"
          gh release upload "v$VERSION" "build\Silvernote-Setup-$VERSION.exe" "build\Silvernote-Setup-$VERSION.exe.blockmap" "build\latest.yml" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - run: npm install
      - run: npm run maj:front
      - run: npm run build:linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: List build files
        run: ls -la build/
        
      - name: Upload to Release
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          gh release upload "v$VERSION" build/*.AppImage build/*.deb build/*.rpm build/latest-linux.yml --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - run: npm install
      - run: npm run maj:front
      - run: npm run build:mac
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: List build files
        run: ls -la build/
        
      - name: Upload to Release
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          gh release upload "v$VERSION" build/*.dmg build/*.zip build/latest-mac.yml --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}