name: Build Electron App

on:
  push:
    branches:
      - front_desktop
      - main

permissions:
  contents: write

jobs:

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - run: npm install
      - run: npm run maj:front
      - run: npm run build:linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: electron-build-linux
          path: build/

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - run: npm install
      - run: npm run maj:front
      - run: npm run build:win
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: electron-build-windows
          path: build/

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - run: npm install
      - run: npm run maj:front
      - run: npm run build:mac
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: electron-build-macos
          path: build/

  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos]

    steps:
      - uses: actions/checkout@v3

      - uses: actions/download-artifact@v4
        with:
          name: electron-build-linux
          path: linux/

      - uses: actions/download-artifact@v4
        with:
          name: electron-build-windows
          path: windows/

      - uses: actions/download-artifact@v4
        with:
          name: electron-build-macos
          path: macos/

      - name: Get version from package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV


      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION }}
          name: Silvernote (${{ env.VERSION }})
          body: Nouvelle version de Silvernote.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION }}
          files: |

            macos/Silvernote-${VERSION}-arm64.dmg
            macos/Silvernote-${VERSION}-arm64-mac.zip


            linux/Silvernote-${VERSION}.AppImage
            linux/silvernote_${VERSION}_amd64.deb
            linux/silvernote-${VERSION}.x86_64.rpm

            windows/Silvernote Setup ${VERSION}.exe 
            windows/Silvernote Setup ${VERSION}.exe.blockmap

            windows/latest.yml release/latest.yml
            linux/latest-linux.yml release/latest-linux.yml
            macos/latest-mac.yml release/latest-mac.yml

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
