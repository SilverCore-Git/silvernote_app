name: Build Electron App

on:
  push:
    branches:
      - front_desktop
      - main

permissions:
  contents: write

jobs:

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - run: npm install
      - run: npm run maj:front
      - run: npm run build:linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: electron-build-linux
          path: build/

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - run: npm install
      - run: npm run maj:front
      - run: npm run build:win
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: electron-build-windows
          path: build/

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - run: npm install
      - run: npm run maj:front
      - run: npm run build:mac
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: electron-build-macos
          path: build/

  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos]

    steps:
      - uses: actions/checkout@v3

      - uses: actions/download-artifact@v4
        with:
          name: electron-build-linux
          path: linux/

      - uses: actions/download-artifact@v4
        with:
          name: electron-build-windows
          path: windows/

      - uses: actions/download-artifact@v4
        with:
          name: electron-build-macos
          path: macos/

      - name: Get version from package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Rename artifacts
        run: |
          mkdir release

          # macOS
          mv macos/Silvernote-${VERSION}-arm64.dmg release/silvernote-${VERSION}-macos.dmg
          mv macos/Silvernote-${VERSION}-arm64-mac.zip release/silvernote-${VERSION}-macos.app.zip

          # Linux
          mv linux/Silvernote-${VERSION}.AppImage release/silvernote-${VERSION}-linux-setup.AppImage
          mv linux/silvernote_${VERSION}_amd64.deb release/silvernote-${VERSION}-linux-setup.deb
          mv linux/silvernote-${VERSION}.x86_64.rpm release/silvernote-${VERSION}-linux-setup.rpm

          # Windows
          mv "windows/Silvernote Setup ${VERSION}.exe" "release/silvernote-${VERSION}-win-setup.exe"
          mv "windows/Silvernote Setup ${VERSION}.exe.blockmap" "release/silvernote-${VERSION}-win-setup.exe.blockmap"

          # latest yml
          mv windows/latest.yml release/latest.yml
          mv linux/latest-linux.yml release/latest-linux.yml
          mv macos/latest-mac.yml release/latest-mac.yml

      # 🔥 PATCH DES YAML (CRUCIAL POUR ELECTRON-UPDATER)

      - name: Patch latest.yml (Windows)
        run: |
          sed -i "s|Silvernote Setup ${VERSION}.exe|silvernote-${VERSION}-win-setup.exe|g" release/latest.yml

      - name: Patch latest-linux.yml
        run: |
          sed -i "s|Silvernote-${VERSION}.AppImage|silvernote-${VERSION}-linux-setup.AppImage|g" release/latest-linux.yml
          sed -i "s|silvernote_${VERSION}_amd64.deb|silvernote-${VERSION}-linux-setup.deb|g" release/latest-linux.yml
          sed -i "s|silvernote-${VERSION}.x86_64.rpm|silvernote-${VERSION}-linux-setup.rpm|g" release/latest-linux.yml

      - name: Patch latest-mac.yml
        run: |
          sed -i "s|Silvernote-${VERSION}-arm64-mac.zip|silvernote-${VERSION}-macos.app.zip|g" release/latest-mac.yml
          sed -i "s|Silvernote-${VERSION}-arm64.dmg|silvernote-${VERSION}-macos.dmg|g" release/latest-mac.yml

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION }}
          name: Silvernote (${{ env.VERSION }})
          body: |
            Nouvelle version de Silvernote.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION }}
          files: |
            release/silvernote-${{ env.VERSION }}-linux-setup.rpm
            release/silvernote-${{ env.VERSION }}-linux-setup.deb
            release/silvernote-${{ env.VERSION }}-linux-setup.AppImage

            release/silvernote-${{ env.VERSION }}-win-setup.exe
            release/silvernote-${{ env.VERSION }}-win-setup.exe.blockmap

            release/silvernote-${{ env.VERSION }}-macos.dmg
            release/silvernote-${{ env.VERSION }}-macos.app.zip

            release/latest.yml
            release/latest-linux.yml
            release/latest-mac.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
