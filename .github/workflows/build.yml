name: Build Electron App

on:
  push:
    branches:
      - front_desktop
      - main

permissions:
  contents: write

jobs:

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - run: npm install
      - run: npm run maj:front
      - run: npm run build:linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v3
        with:
          name: electron-build-linux
          path: build/

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - run: npm install
      - run: npm run maj:front
      - run: npm run build:win
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v3
        with:
          name: electron-build-windows
          path: build/

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - run: npm install
      - run: npm run maj:front
      - run: npm run build:mac
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v3
        with:
          name: electron-build-macos
          path: build/

  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos]

    steps:
      - uses: actions/checkout@v3

      - uses: actions/download-artifact@v3
        with:
          name: electron-build-linux
          path: linux/

      - uses: actions/download-artifact@v3
        with:
          name: electron-build-windows
          path: windows/

      - uses: actions/download-artifact@v3
        with:
          name: electron-build-macos
          path: macos/

      - name: Get version from package.json
        id: package-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: List downloaded files (debug)
        run: |
          echo "=== Linux files ==="
          ls -la linux/
          echo "=== Windows files ==="
          ls -la windows/
          echo "=== macOS files ==="
          ls -la macos/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION }}
          name: Silvernote v${{ env.VERSION }}
          body: |
            ## 🎉 Nouvelle version de Silvernote v${{ env.VERSION }}
            
            ### 📦 Téléchargements
            - **Windows**: `Silvernote Setup ${{ env.VERSION }}.exe`
            - **macOS**: `Silvernote-${{ env.VERSION }}-arm64.dmg`
            - **Linux**: `Silvernote-${{ env.VERSION }}.AppImage`
            
            ### 🔄 Mise à jour automatique
            Si vous avez déjà installé Silvernote, l'application se mettra à jour automatiquement.
          draft: false
          prerelease: false
          files: |
            windows/*.exe
            windows/*.blockmap
            windows/latest.yml
            linux/*.AppImage
            linux/*.deb
            linux/*.rpm
            linux/latest-linux.yml
            macos/*.dmg
            macos/*.zip
            macos/latest-mac.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}