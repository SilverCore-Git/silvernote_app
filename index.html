<!doctype html>
<html lang="fr">
<head>

  <!-- ========================= -->
  <!-- Basics -->
  <!-- ========================= -->
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Silvernote – Application de prise de notes</title>

  <!-- ========================= -->
  <!-- SEO -->
  <!-- ========================= -->
  <meta name="description"
        content="Silvernote est une application de prise de notes simple, rapide et sécurisée, accessible sur le web, mobile et ordinateur." />

  <meta name="robots" content="index, follow" />
  <meta name="author" content="SilverCore" />
  <meta name="publisher" content="SilverCore" />
  <meta name="copyright" content="© 2025 SilverCore" />
  <meta name="language" content="fr" />
  <meta name="rating" content="general" />
  <meta name="format-detection" content="telephone=no" />

  <link rel="canonical" href="https://app.silvernote.fr/" />

  <!-- ========================= -->
  <!-- Open Graph -->
  <!-- ========================= -->
  <meta property="og:title" content="Silvernote – Application de prise de notes" />
  <meta property="og:description"
        content="Application de prise de notes moderne, rapide et synchronisée sur tous vos appareils." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Silvernote" />
  <meta property="og:locale" content="fr_FR" />
  <meta property="og:url" content="https://app.silvernote.fr/" />
  <meta property="og:image" content="https://app.silvernote.fr/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- ========================= -->
  <!-- Twitter Card -->
  <!-- ========================= -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Silvernote – Application de prise de notes" />
  <meta name="twitter:description"
        content="Prenez, organisez et synchronisez vos notes simplement avec Silvernote." />
  <meta name="twitter:image" content="https://app.silvernote.fr/og-image.png" />

  <!-- ========================= -->
  <!-- PWA / App feel -->
  <!-- ========================= -->
  <meta name="theme-color" content="#F28C28" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Silvernote" />

  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- ========================= -->
  <!-- Performance -->
  <!-- ========================= -->
  <link rel="preconnect" href="https://api.silvernote.fr" crossorigin />
  <link rel="preload" as="image" href="/assets/img/sign-bg.jpg" />

  <!-- ========================= -->
  <!-- Session cleanup -->
  <!-- ========================= -->
  <script>
    const handleClose = () => {
      navigator.sendBeacon?.(
        'https://api.silvernote.fr/user/session/close'
      ) || fetch('https://api.silvernote.fr/user/session/close', {
        method: 'POST',
        credentials: 'include'
      });
    };
    window.addEventListener('beforeunload', handleClose);
  </script>

  <!-- ========================= -->
  <!-- Loading styles -->
  <!-- ========================= -->
  <style>

    :root {

        --bg: black;
        --bg2: black;
        --white: #FFF;
        --text: black;
        --text-strong: black;
        --text-little: black;
        --shadow: #333333;
        --btn: #F28C28;
        --btn-hover: #ea580c;

        --br-main: 24px;
        --br-card: 16px;
        --br-btn: 12px;
        --br-tag: 8px;

        --mrl: 1em;
        --mlr: 1em;
        --mt: 1em;

    }

    body.dark {
        --bg: #121212; 
        --bg2: #1E1E1E; 
        --white: #252525; 
        --text: #fff; 
        --text-strong: #FFFFFF; 
        --text-little: #A0A0A0; 
        --shadow: #000000CC;
    }


    body.light {
        --bg: #FFF8F0;
        --bg2: #FFF3E0;
        --white: #FFF;
        --text: #000;
        --text-strong: rgb(51, 51, 51);
        --text-little: #6e6e6ea2;
        --shadow: #33333381;
    }


    * {
      scrollbar-color: var(--btn) var(--bg2);
    }

    *::-webkit-scrollbar-thumb {
      background: var(--btn);
      border-radius: 10px;
    }

    body {
      margin: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      transition: background-color 900ms;
    }

    .centered-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      gap: 1rem;
    }

    ._spinner {
      position: relative;
      width: 90px;
      height: 90px;
    }

    .spiner {
      position: absolute;
      top: 50%;
      left: 50%;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      border: 4px solid transparent;
    }

    .spiner1 {
      width: 40px;
      height: 40px;
      border-right-color: #F28C28;
      animation: spinner-rotate 0.6s linear infinite;
    }

    .spiner2 {
      width: 60px;
      height: 60px;
      border-right-color: #F28C28;
      opacity: 0.9;
      animation: spinner-rotate 1s linear infinite;
      animation-delay: 0.3s;
    }

    .spiner3 {
      width: 77px;
      height: 77px;
      border: 6px solid #F28C28;
      border-right-color: transparent;
      border-top-color: transparent;
      opacity: 0.6;
      animation: spinner-reverse 1.5s linear infinite;
    }

    .spiner4 {
      border: 6px solid #F28C28;
      animation: spinner-flash 3s ease-in-out infinite;
    }

    @keyframes spinner-rotate {
      to {
        transform: translate(-50%, -50%) rotate(360deg);
      }
    }

    @keyframes spinner-reverse {
      to {
        transform: translate(-50%, -50%) rotate(-360deg);
      }
    }

    @keyframes spinner-flash {
      0% { width: 70px; height: 70px; opacity: 0; }
      15% { width: 97px; height: 97px; opacity: 1; }
      30% { width: 70px; height: 70px; opacity: 0.1; }
      100% { opacity: 0; }
    }

    .loading-text {
      font-size: 0.9rem;
      opacity: 0.75;
    }
  </style>

</head>

<body>

  <noscript>
    Silvernote nécessite JavaScript pour fonctionner correctement.
  </noscript>

  <div id="app" role="application" aria-label="Application Silvernote">
    <div class="centered-container">
      <div class="_spinner" aria-hidden="true">
        <div class="spiner spiner1"></div>
        <div class="spiner spiner2"></div>
        <div class="spiner spiner3"></div>
        <div class="spiner spiner4"></div>
      </div>
      <span class="loading-text">Chargement de l’application…</span>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>

</body>
</html>
