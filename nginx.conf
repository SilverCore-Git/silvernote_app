server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vue Router (history mode) : toute route inconnue renvoie l'app
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fichiers hashés par Vite : cache long
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
